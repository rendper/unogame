<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Mobile: Master Edition</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --accent-gold: #fbbf24;
      --card-red: #ef4444;
      --card-blue: #3b82f6;
      --card-green: #22c55e;
      --card-yellow: #eab308;
      --card-dark: #1e293b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top Bar Header */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .currency-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--accent-gold);
      font-weight: bold;
      color: var(--accent-gold);
    }

    /* Main Screens */
    .screen {
      display: none;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 60px;
    }

    .screen.active {
      display: flex;
    }

    .card-panel {
      background: var(--panel-bg);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 16px;
    }

    /* Game Board Layout */
    #game-screen {
      max-width: 900px;
      height: calc(100vh - 80px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    #game-screen.active {
      display: flex;
    }

    .play-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      position: relative;
    }

    /* UNO Cards */
    .uno-card {
      width: 80px;
      height: 120px;
      border-radius: 10px;
      background-color: var(--card-dark);
      border: 3px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      color: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }

    .uno-card:hover {
      transform: translateY(-10px);
    }

    .uno-card.RED { background-color: var(--card-red); }
    .uno-card.BLUE { background-color: var(--card-blue); }
    .uno-card.GREEN { background-color: var(--card-green); }
    .uno-card.YELLOW { background-color: var(--card-yellow); }
    .uno-card.WILD { background: linear-gradient(135deg, var(--card-red), var(--card-blue), var(--card-green), var(--card-yellow)); }

    /* Player Hand Container */
    .player-hand {
      display: flex;
      justify-content: center;
      gap: -20px;
      padding: 10px;
      overflow-x: auto;
      max-width: 100%;
    }

    /* Opponents Bar */
    .opponents-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      padding: 10px;
    }

    .opponent-box {
      background: var(--panel-bg);
      padding: 8px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .deck-pile {
      border: 3px dashed var(--accent-gold);
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header-bar">
    <div class="user-profile">
      <div class="avatar-badge" id="player-avatar">😎</div>
      <span id="player-username" style="font-weight: bold;">Guest</span>
    </div>
    <div class="currency-display">
      🪙 <span id="coin-balance">1,000</span>
    </div>
  </div>

  <!-- Auth Screen (Login / Register) -->
  <div id="auth-screen" class="screen active">
    <div class="card-panel">
      <h2>UNO Mobile Master</h2>
      <p style="color: #94a3b8; margin-bottom: 15px;">Login or create an account</p>
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button class="btn btn-primary" onclick="login()">Login</button>
      <button class="btn btn-secondary" onclick="register()">Sign Up</button>
    </div>
  </div>

  <!-- Main Menu Screen -->
  <div id="menu-screen" class="screen">
    <div class="card-panel">
      <h2>Game Lobby</h2>
      <p style="color: #94a3b8; margin-bottom: 20px;">Choose a match entry fee</p>
      
      <button class="btn btn-gold" onclick="startSinglePlayer(100)">🎮 Practice vs AI (100 Coins)</button>
      <button class="btn btn-primary" onclick="joinOnlineMatch(500)">🌐 Online Match (500 Coins)</button>
      <button class="btn btn-secondary" onclick="joinOnlineMatch(2000)">🔥 High Roller (2,000 Coins)</button>
    </div>
  </div>

  <!-- Active Game Screen -->
  <div id="game-screen" class="screen">
    <div class="opponents-bar">
      <div class="opponent-box">Bot 1 🎴 x<span id="bot1-cards">7</span></div>
      <div class="opponent-box">Bot 2 🎴 x<span id="bot2-cards">7</span></div>
      <div class="opponent-box">Bot 3 🎴 x<span id="bot3-cards">7</span></div>
    </div>

    <div class="play-area">
      <!-- Draw Deck -->
      <div class="uno-card deck-pile" onclick="drawCard()">
        📥
      </div>

      <!-- Discard Pile -->
      <div class="uno-card RED" id="discard-card">
        7
      </div>
    </div>

    <!-- Player Hand -->
    <div class="player-hand" id="player-hand">
      <!-- Cards rendered via JS -->
    </div>
  </div>

  <script>
    // Global User State
    let currentUser = {
      username: 'Guest',
      coins: 1000,
      avatar: '😎'
    };

    // Socket.io Connection to Live Render Backend
    const socket = io('https://unofromusuthebanna.onrender.com');

    // ------------------------------------
    // Auth Functions
    function login() {
      const user = document.getElementById('auth-username').value;
      if (!user) return alert('Please enter a username');
      
      const saved = localStorage.getItem('uno_user_' + user);
      if (saved) {
        currentUser = JSON.parse(saved);
      } else {
        currentUser.username = user;
        saveUserData();
      }
      showScreen('menu-screen');
      updateUI();
    }

    function register() {
      login();
    }

    function saveUserData() {
      localStorage.setItem('uno_user_' + currentUser.username, JSON.stringify(currentUser));
    }

    function updateUI() {
      document.getElementById('player-username').innerText = currentUser.username;
      document.getElementById('coin-balance').innerText = currentUser.coins.toLocaleString();
      document.getElementById('player-avatar').innerText = currentUser.avatar;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // ------------------------------------
    // UNO Game Core Logic
    let playerHand = [];
    
    function startSinglePlayer(fee) {
      if (currentUser.coins < fee) {
        return alert("Not enough coins! Use console cheat addCoins() to top up.");
      }

      currentUser.coins -= fee;
      saveUserData();
      updateUI();

      playerHand = [
        { color: 'RED', value: '5' },
        { color: 'BLUE', value: '2' },
        { color: 'GREEN', value: 'SKIP' },
        { color: 'YELLOW', value: '9' },
        { color: 'WILD', value: '+4' }
      ];

      renderHand();
      showScreen('game-screen');
    }

    function joinOnlineMatch(fee) {
      socket.emit('joinRoom', {
        username: currentUser.username,
        roomCode: 'GLOBAL_ROOM',
        entryFee: fee
      });
      startSinglePlayer(fee);
    }

    function renderHand() {
      const container = document.getElementById('player-hand');
      container.innerHTML = '';
      playerHand.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `uno-card ${card.color}`;
        cardEl.innerText = card.value;
        cardEl.onclick = () => playCard(index);
        container.appendChild(cardEl);
      });
    }

    function playCard(index) {
      playerHand.splice(index, 1);
      renderHand();
      if (playerHand.length === 0) {
        alert("🎉 YOU WIN! Total Pot Awarded!");
        currentUser.coins += 2000;
        saveUserData();
        updateUI();
        showScreen('menu-screen');
      }
    }

    function drawCard() {
      const colors = ['RED', 'BLUE', 'GREEN', 'YELLOW'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const randomValue = Math.floor(Math.random() * 9) + 1;
      
      playerHand.push({ color: randomColor, value: randomValue.toString() });
      renderHand();
    }

    // ------------------------------------
    // CONSOLE CHEATS & SPECIAL FUNCTIONS
    function addCoins(amount) {
      const added = amount || 5000000;
      currentUser.coins += added;
      saveUserData();
      updateUI();
      console.log(`⚡ Added ${added.toLocaleString()} coins to ${currentUser.username}!`);
      alert(`🎉 Added ${added.toLocaleString()} coins!`);
    }

    function usufan5763() {
      const claimedKey = 'usufan5763_claimed_' + currentUser.username;

      if (localStorage.getItem(claimedKey)) {
        console.log("thxm for playing my uno it means a lot ");
        console.warn("thxm for playing my uno game btw (Reward already claimed!)");
        alert("⚠️ You have already claimed your 10 coins from this function!");
        return;
      }

      currentUser.coins += 10;
      localStorage.setItem(claimedKey, 'true');
      saveUserData();
      updateUI();

      console.log("thxm for playing my uno it means a lot ");
      console.warn("thxm for playing my uno game btw");
      alert("🎉 10 Coins added! Thank you for playing!");
    }

    function coins12() {
      usufan5763();
    }

    // Explicitly bind all functions to window for global access
    window.login = login;
    window.register = register;
    window.startSinglePlayer = startSinglePlayer;
    window.joinOnlineMatch = joinOnlineMatch;
    window.drawCard = drawCard;
    window.addCoins = addCoins;
    window.usufan5763 = usufan5763;
    window.coins12 = coins12;
  </script>
</body>
</html>
